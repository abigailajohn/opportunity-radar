name: Opportunity Radar Daily

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opportunity-radar-daily
  cancel-in-progress: false

jobs:
  run-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Opportunity Radar
        run: python -m pip install .

      - name: Reconstruct private profile
        shell: bash
        env:
          PROFILE_B64: ${{ secrets.OPPORTUNITY_RADAR_PROFILE_B64 }}
        run: |
          set -euo pipefail
          if [[ -z "${PROFILE_B64}" ]]; then
            echo "::error::OPPORTUNITY_RADAR_PROFILE_B64 is not configured."
            exit 1
          fi
          mkdir -p config
          printf '%s' "${PROFILE_B64}" | base64 --decode > config/profile.yaml
          test -s config/profile.yaml

      - name: Run daily Opportunity Radar cycle
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          OPPORTUNITY_RADAR_DATABASE_URL: ${{ secrets.OPPORTUNITY_RADAR_DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m scripts.run_daily --mode deterministic

      - name: Remove reconstructed profile
        if: always()
        run: rm -f config/profile.yaml
